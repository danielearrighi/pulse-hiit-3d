<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="builder.title">Crea Scheda HIIT - Pulse HIIT 3D</title>
  <meta name="description" content="Crea e personalizza la tua scheda di allenamento HIIT a circuiti.">

  <!-- Favicon & PWA / Launcher Icons -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <meta name="theme-color" content="#0e1216">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse HIIT 3D">
  <meta name="application-name" content="Pulse HIIT 3D">
  <link rel="stylesheet" href="/css/material3.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/builder.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/player.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/turbo.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/js/mannequin.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/categories.js" defer></script>
  <script src="/js/material3.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/shared-nav.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/builder.js" defer></script>
  <script src="/js/editor.js" defer></script>
  <script src="/js/library.js" defer></script>
  <script src="/js/player.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>

  <div class="app-layout">
    <!-- Desktop Navigation Rail -->
    <div id="navRailContainer"></div>

    <div class="main-wrapper">
      <!-- Top App Bar -->
      <div id="topAppBarContainer"></div>

      <!-- Main Content -->
      <main class="content-container">
        <div class="builder-header">
          <h1 class="builder-header__title" data-i18n="builder.title">Crea Scheda HIIT</h1>
          <p class="builder-header__subtitle" data-i18n="builder.subtitle">
            Configura gruppi di esercizi, ripetizioni del circuito e obiettivi (ripetizioni o tempo).
          </p>
        </div>

        <div class="builder-card">
          <!-- Plan Name -->
          <div class="md-field-group">
            <input type="text" id="planNameInput" class="md-input" placeholder=" " required>
            <label class="md-field-label" for="planNameInput" data-i18n="builder.plan_name_label">Nome della Scheda</label>
          </div>

          <!-- Plan Description -->
          <div class="md-field-group">
            <textarea id="planDescInput" class="md-input md-textarea" placeholder=" " rows="2"></textarea>
            <label class="md-field-label" for="planDescInput" data-i18n="builder.plan_desc_label">Descrizione (Opzionale)</label>
          </div>

          <!-- Public Plan Switch (ADMIN & SUPER only) -->
          <div id="isPublicGroup" style="display: none; margin-top: 0.5rem; margin-bottom: 1rem;">
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--md-sys-color-surface-container); border-radius: 12px; cursor: pointer; border: 1px solid var(--md-sys-color-outline-variant);">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary); font-size: 24px;">public</span>
                <div>
                  <strong style="display: block; font-size: 0.95rem; color: var(--md-sys-color-on-surface);" data-i18n="builder.is_public_label">Scheda Pubblica</strong>
                  <span style="display: block; font-size: 0.78rem; color: var(--md-sys-color-on-surface-variant);" data-i18n="builder.is_public_desc">Visibile a chiunque (anche non loggati) in home page</span>
                </div>
              </div>
              <input type="checkbox" id="planIsPublicInput" style="width: 20px; height: 20px; accent-color: var(--md-sys-color-primary); cursor: pointer;">
            </label>
          </div>

          <!-- Circuit Groups Section Header -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem 0;">
            <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--md-sys-color-on-surface);" data-i18n="builder.circuit_groups">Gruppi Circuito Esercizi</h3>
            <button type="button" id="addGroupBtn" class="md-btn md-btn-tonal" data-i18n="builder.add_group">
              <span class="material-symbols-rounded">add</span>
              Aggiungi Circuito
            </button>
          </div>

          <!-- Groups Container -->
          <div id="groupsContainer">
            <!-- Rendered dynamically by builder.js -->
          </div>

          <!-- Save Button -->
          <div style="margin-top: 2rem;">
            <button type="button" id="savePlanBtn" class="md-btn md-btn-filled" style="width: 100%; height: 50px; font-size: 1rem;" data-i18n="builder.save_plan">
              <span class="material-symbols-rounded">save</span>
              Salva Scheda HIIT
            </button>
          </div>
        </div>
      </main>

      <!-- Mobile Bottom Navigation -->
      <div id="bottomNavContainer"></div>
    </div>
  </div>

  <!-- Searchable Exercise Picker Dialog / Bottom Sheet -->
  <div class="md-dialog-backdrop" id="exercisePickerModal">
    <div class="md-dialog exercise-picker-dialog">
      <div class="md-dialog__header">
        <h3 class="md-dialog__title" data-i18n="builder.select_exercise_title">Seleziona Esercizio</h3>
        <button type="button" class="md-btn-icon" id="closeExercisePickerBtn" aria-label="Chiudi">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <!-- Search Box with Clear Button -->
      <div class="exercise-picker-search-wrap">
        <span class="material-symbols-rounded exercise-picker-search-icon">search</span>
        <input type="text" id="exerciseSearchInput" class="exercise-picker-search-input" placeholder="Cerca per nome, categoria o nota..." data-i18n-placeholder="builder.search_exercise_placeholder" autocomplete="off">
        <button type="button" id="clearExerciseSearchBtn" class="md-btn-icon exercise-picker-clear-btn" aria-label="Cancella ricerca" style="display: none;">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <!-- Category Filter Chips -->
      <div id="exercisePickerCategoryChips" class="filter-chips-bar exercise-picker-chips"></div>

      <!-- Results Count Bar -->
      <div id="exercisePickerCount" class="exercise-picker-count"></div>

      <!-- Exercise Items List -->
      <div id="exercisePickerList" class="exercise-picker-list">
        <!-- Rendered dynamically by builder.js -->
      </div>
    </div>
  </div>

  <!-- 3D Exercise Animated Preview Dialog -->
  <div class="md-dialog-backdrop" id="builderPreviewModalDialog">
    <div class="md-dialog" style="max-width: 560px;">
      <div class="md-dialog__header">
        <h3 class="md-dialog__title" id="builderPreviewModalTitle">Anteprima Esercizio</h3>
        <button type="button" class="md-btn-icon" id="builderPreviewModalCloseBtn" aria-label="Chiudi">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="preview-canvas-wrap">
        <canvas id="builderPreviewCanvas"></canvas>
      </div>
      <div id="builderPreviewModalNotes" class="preview-notes-box" style="display: none; margin-top: 1rem; padding: 0.85rem 1rem; background: var(--md-sys-color-surface-container-high); border-radius: var(--md-shape-md); border-left: 4px solid var(--md-sys-color-primary);">
        <div style="display: flex; align-items: center; gap: 0.4rem; font-weight: 700; font-size: 0.82rem; color: var(--md-sys-color-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.35rem;">
          <span class="material-symbols-rounded" style="font-size: 18px;">sticky_note_2</span>
          <span data-i18n="builder.notes_label">Note Esercizio</span>
        </div>
        <p id="builderPreviewModalNotesText" style="font-size: 0.9rem; color: var(--md-sys-color-on-surface); margin: 0; line-height: 1.5; white-space: pre-line;"></p>
      </div>
      <div class="md-dialog__actions">
        <button type="button" class="md-btn md-btn-filled" id="builderPreviewModalDismissBtn">Chiudi</button>
      </div>
    </div>
  </div>

</body>
</html>
