<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Allenamento HIIT 3D - Pulse HIIT 3D</title>
  <meta name="description" content="Player interattivo per allenamento cardio HIIT con simulatore 3D.">
  <link rel="stylesheet" href="/css/material3.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/builder.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/player.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/turbo.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/js/mannequin.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/categories.js" defer></script>
  <script src="/js/material3.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/shared-nav.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/builder.js" defer></script>
  <script src="/js/editor.js" defer></script>
  <script src="/js/library.js" defer></script>
  <script src="/js/player.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>

  <div class="player-screen">
    <!-- Top Bar -->
    <header class="player-top-bar">
      <div>
        <div id="playerStepCounter" style="font-size: 0.75rem; font-weight: 700; color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px;">
          Passaggio 1 di 10
        </div>
        <div id="playerGroupTitle" style="font-size: 1.15rem; font-weight: 800; color: var(--md-sys-color-on-surface);">
          Circuito 1 (1/3)
        </div>
      </div>
      <button type="button" id="playerCloseBtn" class="md-btn md-btn-danger" style="height: 38px; padding: 0 1rem;" data-i18n="player.exit">
        <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
        Esci
      </button>
    </header>

    <!-- Main Workout Area -->
    <main class="player-main-area">
      <!-- 3D Mannequin Viewport -->
      <div class="player-canvas-container">
        <canvas id="playerCanvas"></canvas>

        <!-- Next Exercise Preview Overlay (during recovery) -->
        <div class="player-next-preview" id="playerNextPreview" style="display: none;" aria-live="polite">
          <div class="player-next-preview-card">
            <div class="player-next-preview-canvas-wrap">
              <canvas id="playerPreviewCanvas"></canvas>
            </div>
            <div class="player-next-preview-info">
              <div class="player-next-preview-badge">
                <span class="material-symbols-rounded" style="font-size: 14px;">skip_next</span>
                <span data-i18n="player.next_up">Prossimo</span>
              </div>
              <div class="player-next-preview-name" id="playerNextPreviewName"></div>
              <div class="player-next-preview-target" id="playerNextPreviewTarget"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls & Timer Wrap -->
      <div class="player-info-container">
        <div class="player-exercise-header">
          <span id="playerCategoryBadge" class="md-badge md-badge-primary" style="margin-bottom: 0.5rem;">Cardio</span>
          <h2 id="playerExerciseName" class="player-exercise-name">Burpees</h2>
          <div id="playerExerciseNote" class="player-exercise-note" style="display: none;" role="button" tabindex="0" title="Clicca per visualizzare la nota completa">
            <span class="material-symbols-rounded" style="font-size: 16px; color: var(--md-sys-color-primary); flex-shrink: 0;">sticky_note_2</span>
            <span id="playerExerciseNoteText"></span>
            <span class="material-symbols-rounded" style="font-size: 15px; color: var(--md-sys-color-on-surface-variant); flex-shrink: 0; margin-left: 0.15rem;">info</span>
          </div>
        </div>

        <!-- Duration Countdown Ring -->
        <div class="timer-ring-wrap" id="timerRingWrap">
          <svg class="timer-ring-svg" viewBox="0 0 240 240">
            <circle class="timer-ring-bg" cx="120" cy="120" r="110" />
            <circle class="timer-ring-progress" id="timerRingProgress" cx="120" cy="120" r="110" />
          </svg>
          <div class="timer-number-display" id="playerTimerNumber">40</div>
        </div>

        <!-- Repetition Target Display Mode -->
        <div id="repsDisplayWrap" class="reps-display-wrap" style="display: none;">
          <div class="reps-target-label" data-i18n="player.target_goal">
            Obiettivo Ripetizioni
          </div>
          <div class="reps-number-display" id="playerRepsCount">50 RIPETIZIONI</div>
        </div>

        <!-- Action Control Buttons -->
        <div class="player-bottom-controls">
          <button type="button" id="playerPauseBtn" class="md-btn md-btn-tonal btn-player-pause" data-i18n="player.pause">
            <span class="material-symbols-rounded">pause</span>
            Pausa
          </button>
          <div class="player-nav-btn-group" role="group">
            <button type="button" id="playerPrevBtn" class="md-btn md-btn-filled btn-player-prev" title="Indietro" aria-label="Indietro" data-i18n-title="player.back" data-i18n-aria-label="player.back">
              <span class="material-symbols-rounded filled">skip_previous</span>
            </button>
            <button type="button" id="playerNextBtn" class="md-btn md-btn-filled btn-player-next" data-i18n="player.next">
              <span class="material-symbols-rounded filled">skip_next</span>
              Successivo
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Workout Finished Celebration Overlay -->
    <div class="workout-finished-overlay" id="workoutFinishedOverlay">
      <span class="material-symbols-rounded" style="font-size: 5rem; color: var(--md-sys-color-primary); margin-bottom: 1rem;">emoji_events</span>
      <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem;" data-i18n="player.workout_completed">Allenamento Completato!</h1>
      <p style="font-size: 1.1rem; color: var(--md-sys-color-on-surface-variant); max-width: 480px; margin-bottom: 2rem;" data-i18n="player.great_job">
        Ottimo lavoro! Hai completato la scheda HIIT.
      </p>
      <button type="button" id="finishReturnBtn" class="md-btn md-btn-filled" style="height: 52px; padding: 0 2rem; font-size: 1rem;">
        <span class="material-symbols-rounded">home</span>
        Torna alla Dashboard
      </button>
    </div>
  </div>

  <!-- Exercise Note Modal Dialog -->
  <div class="md-dialog-backdrop" id="playerNoteDialog">
    <div class="md-dialog" style="max-width: 480px;">
      <div class="md-dialog__header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary); font-size: 22px;">sticky_note_2</span>
          <h3 class="md-dialog__title" id="playerNoteDialogTitle" data-i18n="player.notes_dialog_title">Nota Esercizio</h3>
        </div>
        <button type="button" class="md-btn-icon" id="playerNoteDialogCloseBtn" aria-label="Chiudi">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div style="padding: 1.25rem; max-height: 60vh; overflow-y: auto;">
        <h4 id="playerNoteDialogExerciseName" style="font-size: 1.15rem; font-weight: 700; margin: 0 0 0.75rem 0; color: var(--md-sys-color-primary);"></h4>
        <p id="playerNoteDialogText" style="font-size: 0.95rem; line-height: 1.6; color: var(--md-sys-color-on-surface); margin: 0; white-space: pre-line; word-break: break-word;"></p>
      </div>
      <div class="md-dialog__actions">
        <button type="button" class="md-btn md-btn-filled" id="playerNoteDialogDismissBtn" data-i18n="player.notes_dialog_close">Chiudi</button>
      </div>
    </div>
  </div>

</body>
</html>
